<div class="apprenant-shell">

  <!-- ═══════════ NAVBAR FIXE ═══════════ -->
  <nav class="topnav">

    <!-- Logo -->
    <a routerLink="/catalogue" class="nav-brand">
      <span class="brand-icon">⬡</span>
      <span class="brand-text">FormaPro</span>
    </a>

    <!-- Liens -->
    <div class="nav-links">
      <a routerLink="/catalogue" routerLinkActive="nav-link--active" [routerLinkActiveOptions]="{exact:true}" class="nav-link">Catalogue</a>

      <!-- Liens spécifiques à l'apprenant -->
      <ng-container *ngIf="isApprenant()">
        <a routerLink="/mes-inscriptions" routerLinkActive="nav-link--active" class="nav-link">Mes inscriptions</a>
        <a routerLink="/mon-planning"     routerLinkActive="nav-link--active" class="nav-link">Mon planning</a>
        <a routerLink="/mes-notes"        routerLinkActive="nav-link--active" class="nav-link">Mes notes</a>
        <a routerLink="/mes-presences"    routerLinkActive="nav-link--active" class="nav-link">Mes présences</a>
        <a routerLink="/mon-suivi"        routerLinkActive="nav-link--active" class="nav-link">Mon suivi</a>
        <a routerLink="/mes-paiements"    routerLinkActive="nav-link--active" class="nav-link">Mes paiements</a>
      </ng-container>

      <!-- Lien retour dashboard pour autres rôles -->
      <a *ngIf="isAdmin()"     routerLink="/admin/dashboard"     class="nav-link">Admin</a>
      <a *ngIf="isFormateur()" routerLink="/formateur/dashboard" class="nav-link">Formateur</a>
    </div>

    <!-- Utilisateur connecté -->
    <div class="nav-user" *ngIf="isLoggedIn()">
      <div class="user-avatar">
        {{ currentUser?.prenom?.charAt(0) ?? '' }}{{ currentUser?.nom?.charAt(0) ?? '' }}
      </div>
      <span class="user-name">{{ currentUser?.prenom }} {{ currentUser?.nom }}</span>
      <button class="btn-logout" (click)="logout()">Déconnexion</button>
    </div>

    <!-- Bouton connexion si non connecté -->
    <button *ngIf="!isLoggedIn()" class="btn-login" (click)="goToLogin()">Connexion</button>

  </nav>

  <!-- ═══════════ CONTENU ═══════════ -->
  <main class="content-area">
    <router-outlet></router-outlet>
  </main>

</div>
